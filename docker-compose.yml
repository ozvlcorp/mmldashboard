# Production-style стек для Dokploy.
# Один файл поднимает: Postgres (общий) + backend (FastAPI) + worker
# (фоновая синхронизация, будет добавлен в Phase 2) + widget (Next.js).
#
# Локально:   docker compose up
# В Dokploy:  выбрать тип сборки «Docker Compose», указать этот файл,
#             прописать переменные окружения из .env.example в секции
#             Environment Variables проекта.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oysuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-oysuite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oysuite}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт НЕ пробрасываем наружу — доступ только из docker network.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oysuite}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-oysuite}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    # Без секции ports — в Dokploy/Traefik роутинг идёт по доменам на
    # внутренний порт 8000. Локально достучаться можно через
    # `docker compose exec backend curl http://localhost:8000/health`
    # или временно раскомментировать ports для отладки.
    expose:
      - "8000"

  # ──────────────────────────────────────────────────────────────────
  # Worker: scheduler-loop, который каждые 30 минут синхронизирует
  # каждый зарегистрированный (widget, account). Тот же образ что и
  # backend, отличается только командой.
  # ──────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m app.worker.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oysuite}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-oysuite}
      # Worker не принимает HTTP, ADMIN_SECRET/CORS ему не нужны.
    depends_on:
      postgres:
        condition: service_healthy

  widget:
    build:
      context: ./widget
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Phase 3: виджет будет читать snapshots отсюда.
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      - backend
    # Без секции ports — Traefik в Dokploy роутит домен mml.oymoysklad.com
    # сразу на внутренний 3000. Хостовой порт никто не занимает.
    expose:
      - "3000"

volumes:
  postgres_data:
